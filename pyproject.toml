[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "py3sta"
version = "0.0.1"
description = "GPU-accelerated i3-style subtomogram averaging, RELION 4 / Warp compatible"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "pandas", "click", "pyyaml"]

[project.optional-dependencies]
test = ["pytest", "scipy"]
# CUDA 12.x driver: pip install torch --index-url https://download.pytorch.org/whl/cu121
gpu = ["torch>=2.1"]
classify = ["scikit-learn>=1.3", "umap-learn"]      # hdbscan, space: umap
plots = ["matplotlib"]                               # diagnostic PNGs of the steps
explore = ["plotly", "umap-learn", "scikit-learn"]   # py3sta explore (plotly.js is inlined into the page)

[project.scripts]
py3sta = "py3sta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
